<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Definir Nova Senha - SGIE</title>

    <link rel="stylesheet" href="../../sgie.css">
</head>

<body class="definir-senha-page app">

    <!-- NAVBAR COMPARTILHADA -->
    <header class="nav">
        <div class="container nav-in">
            <a href="../../index.html" class="brand"><span class="brand-mark"><i class="ic ic-cap"></i></span>SGIE<span class="brand-tag">Eventos</span></a>
            <nav aria-label="Principal" class="nav-links">
                <a class="nav-link" href="../../index.html">Explorar eventos</a>
            </nav>
            <div class="nav-user" id="nav-user-area">
                <a class="btn btn-ghost btn-sm" href="../login/login.html">Entrar</a>
                <a class="btn btn-primary btn-sm" href="../cadastro/cadastro.html">Criar conta</a>
            </div>
        </div>
    </header>

    <main class="main auth-bg" style="display:grid;place-items:center;padding:48px 24px">

        <section class="card stack lg" style="width:100%;max-width:480px;padding:32px">

            <div>
                <span class="accent-bar"></span>
                <h1 class="h1">Definir nova senha</h1>
                <p class="muted" style="margin-top:4px">
                    Insira o código de 6 dígitos enviado para seu e-mail e crie sua nova senha.
                </p>
            </div>

            <div class="alert alert-info">
                <i class="ic ic-mail" style="flex: none;"></i>
                <div class="small">
                    Código enviado para <strong id="email-destino-texto"></strong>.
                </div>
            </div>

            <div id="mensagem-alerta" style="display: none;"></div>

            <form class="stack" id="form-redefinir-senha" novalidate>

                <div class="field">
                    <div class="row between">
                        <label for="codigo-1" class="label">
                            Código de verificação
                        </label>
                        <button
                            type="button"
                            id="btn-reenviar"
                            class="btn btn-ghost btn-sm"
                            style="padding: 0; min-height: auto; color: var(--primary-ink);"
                        >
                            Reenviar código
                        </button>
                    </div>

                    <div class="code code-inputs">
                        <input
                            type="text"
                            id="codigo-1"
                            class="input"
                            inputmode="numeric"
                            maxlength="1"
                            autocomplete="one-time-code"
                            aria-label="Dígito 1"
                            autofocus
                        >
                        <input
                            type="text"
                            class="input"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Dígito 2"
                        >
                        <input
                            type="text"
                            class="input"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Dígito 3"
                        >
                        <input
                            type="text"
                            class="input"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Dígito 4"
                        >
                        <input
                            type="text"
                            class="input"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Dígito 5"
                        >
                        <input
                            type="text"
                            class="input"
                            inputmode="numeric"
                            maxlength="1"
                            aria-label="Dígito 6"
                        >
                    </div>
                    <span class="hint">Informe os 6 dígitos recebidos no e-mail.</span>
                </div>

                <div class="field">
                    <label for="id_nova_senha" class="label">
                        Nova senha
                    </label>
                    <div class="input-icon">
                        <i class="ic ic-lock"></i>
                        <input
                            type="password"
                            id="id_nova_senha"
                            name="nova_senha"
                            class="input"
                            required
                            placeholder="Mínimo 8 caracteres"
                            autocomplete="new-password"
                        >
                        <button
                            type="button"
                            class="btn btn-ghost btn-sm toggle"
                            data-toggle-senha
                            aria-label="Mostrar senha"
                        >
                            <i class="ic ic-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="id_confirmacao_senha" class="label">
                        Confirmar nova senha
                    </label>
                    <div class="input-icon">
                        <i class="ic ic-lock"></i>
                        <input
                            type="password"
                            id="id_confirmacao_senha"
                            name="confirmacao_senha"
                            class="input"
                            required
                            placeholder="Repita a nova senha"
                            autocomplete="new-password"
                        >
                        <button
                            type="button"
                            class="btn btn-ghost btn-sm toggle"
                            data-toggle-senha
                            aria-label="Mostrar senha"
                        >
                            <i class="ic ic-eye"></i>
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    id="btn-redefinir"
                    class="btn btn-primary btn-lg btn-block"
                >
                    Redefinir Senha e Entrar
                </button>

            </form>

            <hr class="sep">

            <p class="small muted" style="text-align:center">
                <a href="../login/login.html"><b>Voltar ao login</b></a>
            </p>

        </section>

    </main>

    <!-- RODAPÉ COMPARTILHADO -->
    <footer class="footer">
        <div class="container">
            <p>SGIE — Sistema de Gestão de Inscrições e Eventos</p>
        </div>
    </footer>

    <script src="../../config.js"></script>
    <script src="../../api.js"></script>
    <script src="../../shared/dom.js"></script>
    <script src="../../shared/formatters.js"></script>
    <script src="../../shared/mocks.js"></script>
    <script src="../../shared/roles.js"></script>
    <script src="../../shared/layout.js"></script>
    <script src="definir_senha.js"></script>

</body>

</html>

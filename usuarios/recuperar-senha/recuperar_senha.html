<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Senha - SGIE</title>

    <link rel="stylesheet" href="../../sgie.css">
    <link rel="stylesheet" href="../auth.css">
    <link rel="stylesheet" href="recuperar_senha.css">
</head>

<body class="recuperar-page app">

    <!-- NAVBAR COMPARTILHADA -->
    <header class="nav">
        <div class="container nav-in">
            <a href="../../index.html" class="brand">SGIE<span class="brand-tag">Eventos</span></a>
            <nav aria-label="Principal" class="nav-links">
                <a class="nav-link" href="../../index.html">Explorar eventos</a>
            </nav>
            <div class="nav-user" id="nav-user-area">
                <a class="btn btn-ghost btn-sm" href="../login/login.html">Entrar</a>
                <a class="btn btn-primary btn-sm" href="../cadastro/cadastro.html">Criar conta</a>
            </div>
        </div>
    </header>

    <main class="main auth-bg" style="display:grid;place-items:center;padding:48px 24px">

        <section class="card stack lg" style="width:100%;max-width:440px;padding:32px">

            <div>
                <span class="accent-bar"></span>
                <h1 class="h1">Recuperar senha</h1>
                <p class="muted" style="margin-top:4px">
                    Informe seu e-mail para receber o código de validação de 6 dígitos.
                </p>
            </div>

            <div id="mensagem-alerta" style="display: none;"></div>

            <form class="stack" id="form-solicitar-recuperacao" novalidate>

                <div class="field">
                    <label for="id_email" class="label">
                        E-mail cadastrado
                    </label>
                    <div class="input-icon">
                        <i class="ic ic-mail"></i>
                        <input
                            type="email"
                            id="id_email"
                            name="email"
                            class="input"
                            required
                            placeholder="voce@universidade.edu.br"
                            autocomplete="email"
                            autofocus
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    id="btn-solicitar"
                    class="btn btn-primary btn-lg btn-block"
                >
                    Enviar código
                </button>

            </form>

            <hr class="sep">

            <p class="small muted" style="text-align:center">
                Lembrou sua senha? <a href="../login/login.html"><b>Voltar ao login</b></a>
            </p>

        </section>

    </main>

    <!-- RODAPÉ COMPARTILHADO -->
    <footer class="footer">
        <div class="container">
            <p>SGIE — Sistema de Gestão de Inscrições e Eventos</p>
        </div>
    </footer>

    <script src="../../config.js"></script>
    <script src="../../api.js"></script>
    <script src="../../shared/dom.js"></script>
    <script src="../../shared/formatters.js"></script>
    <script src="../../shared/roles.js"></script>
    <script src="../../shared/layout.js"></script>
    <script src="recuperar_senha.js"></script>

</body>

</html>

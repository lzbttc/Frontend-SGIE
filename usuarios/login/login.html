<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - SGIE</title>

    <link rel="icon" type="image/svg+xml" href="../../assets/img/sgie-simbolo.svg">
    <link rel="stylesheet" href="../../sgie.css">
</head>

<body class="login-page app">

    <!-- NAVBAR COMPARTILHADA -->
    <header class="nav">
        <div class="container nav-in">
            <a href="../../index.html" class="brand"><img class="brand-logo" src="../../assets/img/sgie-logo-horizontal.svg" alt="SGIE"></a>
            <nav aria-label="Principal" class="nav-links">
                <a class="nav-link" href="../../index.html">Explorar eventos</a>
            </nav>
            <div class="nav-user" id="nav-user-area">
                <a class="btn btn-ghost btn-sm is-active" href="login.html">Entrar</a>
                <a class="btn btn-primary btn-sm" href="../cadastro/cadastro.html">Criar conta</a>
            </div>
        </div>
    </header>

    <main class="main auth-bg state-center">

        <section class="card stack lg" style="width:100%;max-width:440px;padding:32px">

            <div>
                <span class="accent-bar"></span>
                <h1 class="h1">Entrar</h1>
                <p class="muted mt-1">
                    Acesse sua conta para se inscrever e acompanhar seus eventos.
                </p>
            </div>

            <div id="mensagem-alerta" style="display: none;"></div>

            <form class="stack" id="form-login" novalidate>

                <div class="field">
                    <label for="id_identificador" class="label">
                        E-mail ou CPF
                    </label>
                    <div class="input-icon">
                        <i class="ic ic-user"></i>
                        <input
                            type="text"
                            id="id_identificador"
                            name="identificador"
                            class="input"
                            required
                            placeholder="voce@universidade.edu.br ou CPF"
                            autocomplete="username"
                            autofocus
                        >
                    </div>
                </div>

                <div class="field">
                    <div class="row between">
                        <label for="id_password" class="label">
                            Senha
                        </label>
                        <a href="../recuperar-senha/recuperar_senha.html" class="small">
                            Esqueci minha senha
                        </a>
                    </div>
                    <div class="input-icon">
                        <i class="ic ic-lock"></i>
                        <input
                            type="password"
                            id="id_password"
                            name="password"
                            class="input"
                            required
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                        >
                        <button
                            type="button"
                            class="btn btn-ghost btn-sm toggle"
                            data-toggle-senha
                            aria-label="Mostrar senha"
                        >
                            <i class="ic ic-eye"></i>
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    id="btn-entrar"
                    class="btn btn-primary btn-lg btn-block"
                >
                    Entrar
                </button>

            </form>

            <hr class="sep">

            <p class="small muted text-center">
                Ainda não tem conta? <a href="../cadastro/cadastro.html"><b>Criar conta</b></a>
            </p>

        </section>

    </main>

    <!-- RODAPÉ COMPARTILHADO -->
    <footer class="footer">
        <div class="container">
            <p>SGIE — Sistema de Gestão de Inscrições e Eventos</p>
        </div>
    </footer>

    <script src="../../config.js"></script>
    <script src="../../api.js"></script>
    <script src="../../shared/dom.js"></script>
    <script src="../../shared/formatters.js"></script>
    <script src="../../shared/mocks.js"></script>
    <script src="../../shared/roles.js"></script>
    <script src="../../shared/layout.js"></script>
    <script src="login.js"></script>

</body>

</html>

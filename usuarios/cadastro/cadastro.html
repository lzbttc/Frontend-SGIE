<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - SGIE</title>

    <link rel="icon" type="image/svg+xml" href="../../assets/img/sgie-simbolo.svg">
    <link rel="stylesheet" href="../../sgie.css">
</head>

<body class="cadastro-page app">

    <!-- NAVBAR COMPARTILHADA -->
    <header class="nav">
        <div class="container nav-in">
            <a href="../../index.html" class="brand"><img class="brand-logo" src="../../assets/img/sgie-logo-horizontal.svg" alt="SGIE"></a>
            <nav aria-label="Principal" class="nav-links">
                <a class="nav-link" href="../../index.html">Explorar eventos</a>
            </nav>
            <div class="nav-user" id="nav-user-area">
                <a class="btn btn-ghost btn-sm" href="../login/login.html">Entrar</a>
                <a class="btn btn-primary btn-sm is-active" href="cadastro.html">Criar conta</a>
            </div>
        </div>
    </header>

    <main class="main auth-bg state-center">

        <section class="card stack lg" style="width:100%;max-width:640px;padding:32px">

            <div>
                <span class="accent-bar"></span>
                <h1 class="h1">Criar conta</h1>
                <p class="muted mt-1">
                    Um cadastro serve para se inscrever em eventos e, depois, organizar os seus.
                </p>
            </div>

            <div id="mensagem-alerta" style="display: none;"></div>

            <form class="stack" id="form-cadastro" novalidate>

                <div class="field">
                    <label for="id_nome_completo" class="label">
                        Nome completo
                    </label>
                    <input
                        type="text"
                        id="id_nome_completo"
                        name="nome_completo"
                        class="input"
                        required
                        placeholder="Como aparece no seu documento"
                        autocomplete="name"
                        autofocus
                    >
                </div>

                <div class="grid cols-2 gap-4">

                    <div class="field">
                        <label for="id_email" class="label">
                            E-mail
                        </label>
                        <input
                            type="email"
                            id="id_email"
                            name="email"
                            class="input"
                            required
                            placeholder="voce@universidade.edu.br"
                            autocomplete="email"
                        >
                    </div>

                    <div class="field">
                        <label for="id_cpf" class="label">
                            CPF
                        </label>
                        <input
                            type="text"
                            id="id_cpf"
                            name="cpf"
                            class="input"
                            required
                            placeholder="000.000.000-00"
                            inputmode="numeric"
                        >
                    </div>

                    <div class="field">
                        <label for="id_data_nascimento" class="label">
                            Data de nascimento
                        </label>
                        <input
                            type="text"
                            id="id_data_nascimento"
                            name="data_nascimento"
                            class="input"
                            required
                            placeholder="dd/mm/aaaa"
                            inputmode="numeric"
                        >
                    </div>

                    <div class="field">
                        <label for="id_telefone" class="label">
                            Telefone
                        </label>
                        <input
                            type="tel"
                            id="id_telefone"
                            name="telefone"
                            class="input"
                            placeholder="(71) 99999-9999"
                            inputmode="tel"
                            autocomplete="tel"
                        >
                    </div>

                    <div class="field">
                        <label for="id_password" class="label">
                            Senha
                        </label>
                        <div class="input-icon">
                            <i class="ic ic-lock"></i>
                            <input
                                type="password"
                                id="id_password"
                                name="password"
                                class="input"
                                required
                                placeholder="Mínimo 8 caracteres"
                                autocomplete="new-password"
                            >
                            <button
                                type="button"
                                class="btn btn-ghost btn-sm toggle"
                                data-toggle-senha
                                aria-label="Mostrar senha"
                            >
                                <i class="ic ic-eye"></i>
                            </button>
                        </div>
                        <span class="hint">Mínimo de 8 caracteres.</span>
                    </div>

                    <div class="field">
                        <label for="id_password_confirm" class="label">
                            Confirmar senha
                        </label>
                        <div class="input-icon">
                            <i class="ic ic-lock"></i>
                            <input
                                type="password"
                                id="id_password_confirm"
                                name="confirmacao_senha"
                                class="input"
                                required
                                placeholder="Repita a senha"
                                autocomplete="new-password"
                            >
                            <button
                                type="button"
                                class="btn btn-ghost btn-sm toggle"
                                data-toggle-senha
                                aria-label="Mostrar senha"
                            >
                                <i class="ic ic-eye"></i>
                            </button>
                        </div>
                    </div>

                </div>

                <button
                    type="submit"
                    id="btn-cadastrar"
                    class="btn btn-primary btn-lg btn-block"
                >
                    Criar conta
                </button>

            </form>

            <hr class="sep">

            <p class="small muted text-center">
                Já tem conta? <a href="../login/login.html"><b>Entrar</b></a>
            </p>

        </section>

    </main>

    <!-- RODAPÉ COMPARTILHADO -->
    <footer class="footer">
        <div class="container">
            <p>SGIE — Sistema de Gestão de Inscrições e Eventos</p>
        </div>
    </footer>

    <script src="../../config.js"></script>
    <script src="../../api.js"></script>
    <script src="../../shared/dom.js"></script>
    <script src="../../shared/formatters.js"></script>
    <script src="../../shared/mocks.js"></script>
    <script src="../../shared/roles.js"></script>
    <script src="../../shared/layout.js"></script>
    <script src="cadastro.js"></script>

</body>

</html>

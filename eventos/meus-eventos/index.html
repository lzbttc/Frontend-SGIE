<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus eventos — SGIE</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/img/sgie-simbolo.svg">
    <link rel="stylesheet" href="../../sgie.css">
</head>
<body class="app">
    <header class="nav">
        <div class="container nav-in">
            <a href="../../index.html" class="brand"><img class="brand-logo" src="../../assets/img/sgie-logo-horizontal.svg" alt="SGIE"></a>
            <nav aria-label="Principal" class="nav-links" id="nav-links"></nav>
            <div class="nav-user" id="nav-user-area"></div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <header class="page-head">
                <div>
                    <h1 class="h1">Meus eventos</h1>
                    <p>Eventos que você organiza. Abra um evento para gerenciar inscritos e credenciamento.</p>
                </div>
                <a href="../cadastrar-evento/index.html" class="btn btn-primary" id="btn-novo-evento">
                    <i class="ic ic-plus"></i>Novo evento
                </a>
            </header>

            <div id="mensagem-alerta" style="display: none;"></div>

            <div class="stack lg">
                <!-- Filtros -->
                <form aria-label="Filtros" class="filters" id="filter-bar" style="display: none;">
                    <div class="input-icon">
                        <i class="ic ic-search"></i>
                        <input aria-label="Buscar eventos" class="input" id="filtro-busca" placeholder="Buscar pelo nome do evento" type="search">
                    </div>
                    <select aria-label="Status" class="select" id="filtro-status">
                        <option value="">Todos os status</option>
                        <option value="Rascunho">Rascunho</option>
                        <option value="Configuração">Configuração</option>
                        <option value="Publicado">Publicado</option>
                        <option value="Inscrições abertas">Inscrições abertas</option>
                        <option value="Em realização">Em realização</option>
                        <option value="Finalizado">Finalizado</option>
                        <option value="Arquivado">Arquivado</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </form>

                <!-- Lista de eventos -->
                <div id="lista-meus-eventos" class="stack">
                    <!-- preenchido dinamicamente -->
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            SGIE — Sistema de Gestão de Inscrições e Eventos Universitários
        </div>
    </footer>

    <script src="../../config.js"></script>
    <script src="../../api.js"></script>
    <script src="../../shared/dom.js"></script>
    <script src="../../shared/formatters.js"></script>
    <script src="../../shared/mocks.js"></script>
    <script src="../../shared/roles.js"></script>
    <script src="../../shared/layout.js"></script>
    <script src="meus_eventos.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Eventos - SGIE</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/sgie-simbolo.svg">
    <link rel="stylesheet" href="sgie.css">
</head>
<body class="explorar-page app">
    <!-- NAVBAR COMPARTILHADA -->
    <header class="nav" id="app-nav">
        <div class="container nav-in">
            <a href="index.html" class="brand">
                <img class="brand-logo" src="assets/img/sgie-logo-horizontal.svg" alt="SGIE">
            </a>
            <nav class="nav-links" aria-label="Principal"></nav>
            <div class="nav-user" id="nav-user-area"></div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <header class="hero">
                <div class="hero-text">
                    <span class="hero-bar"></span>
                    <h1 class="h1">Eventos acadêmicos <span>e científicos</span></h1>
                    <p class="hero-subtitle">Congressos, simpósios, oficinas e palestras da universidade. Inscreva-se e envie seus trabalhos.</p>
                </div>
                <div class="hero-art" aria-hidden="true">
                    <span class="art-yellow"></span>
                    <span class="art-green"></span>
                    <span class="art-orange"></span>
                    <span class="art-panel"></span>
                    <span class="art-ring"></span>
                    <span class="art-diamond"></span>
                    <span class="art-cap"><i class="ic ic-cap"></i></span>
                </div>
            </header>

            <div id="mensagem-alerta" hidden></div>

            <section class="filters" id="toolbar-filtros" aria-label="Filtros de eventos">
                <div class="input-icon">
                    <i class="ic ic-search"></i>
                    <input type="text" id="filtro-busca" class="input" placeholder="Buscar por título, descrição ou local" aria-label="Buscar eventos">
                </div>
                <select id="filtro-categoria" class="select" aria-label="Categoria">
                    <option value="">Todas as categorias</option>
                    <option value="Congresso">Congresso</option>
                    <option value="Simpósio">Simpósio</option>
                    <option value="Seminário">Seminário</option>
                    <option value="Feira">Feira</option>
                    <option value="Conferência">Conferência</option>
                    <option value="Festival">Festival</option>
                    <option value="Competição">Competição</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Oficina">Oficina</option>
                    <option value="Curso">Curso</option>
                    <option value="Mini-curso">Mini-curso</option>
                    <option value="Palestra">Palestra</option>
                    <option value="Roda de Conversa">Roda de Conversa</option>
                    <option value="Treinamento">Treinamento</option>
                    <option value="Lançamento de Produto">Lançamento de Produto</option>
                    <option value="Outro">Outro</option>
                </select>
                <select id="filtro-modalidade" class="select" aria-label="Modalidade">
                    <option value="">Qualquer modalidade</option>
                    <option value="Presencial">Presencial</option>
                    <option value="On-line">On-line</option>
                    <option value="Híbrido">Híbrido</option>
                </select>
                <select id="filtro-preco" class="select" aria-label="Preço">
                    <option value="">Qualquer preço</option>
                    <option value="true">Gratuito</option>
                    <option value="false">Pago</option>
                </select>
                <button type="button" id="btn-aplicar-filtros" class="btn btn-primary"><i class="ic ic-filter"></i>Filtrar</button>
                <button type="button" id="btn-limpar-filtros" class="btn btn-ghost">Limpar</button>
            </section>

            <section aria-label="Lista de eventos">
                <p id="loading-spinner" class="muted" style="padding: 24px 0;">Carregando eventos...</p>
                <div class="events" id="grid-eventos" hidden></div>
                <div id="sem-eventos" class="card" style="text-align: center; padding: 48px 24px; margin-top: 16px;" hidden>
                    <h3 id="titulo-vazio" class="h2">Nenhum evento encontrado</h3>
                    <p id="desc-vazio" class="muted" style="margin-top: 8px;">Tente ajustar os filtros aplicados.</p>
                </div>
            </section>
        </div>
    </main>

    <!-- RODAPÉ COMPARTILHADO -->
    <footer class="footer" id="app-footer">
        <div class="container">
            SGIE — Sistema de Gestão de Inscrições e Eventos Universitários
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="shared/dom.js"></script>
    <script src="shared/formatters.js"></script>
    <script src="shared/mocks.js"></script>
    <script src="shared/roles.js"></script>
    <script src="shared/layout.js"></script>
    <script src="index.js"></script>
</body>
</html>
